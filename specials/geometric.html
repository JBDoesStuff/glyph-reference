    <script>
        function copyChar(char, el) {
            navigator.clipboard.writeText(char).then(() => {
                el.classList.remove('copied');
                void el.offsetWidth;
                el.classList.add('copied');

                setTimeout(() => {
                    el.classList.remove('copied');
                }, 700);
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }
    </script>
