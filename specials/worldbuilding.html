<head>
    <link rel="stylesheet" href="../stylesheet.css">
    <link rel="icon" href="../favicons/favicon_svg.svg" type="image/svg+xml">
    <link rel="icon" href="../favicons/favicon_png.png" type="image/png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Worldbuilding Reference</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="markdown-body">
        <h1>Worldbuilding Character Reference</h1>
        <h2>Unveiled Symbols</h2>

        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Name / Use</th>
                    <th>Symbol</th>
                    <th>Name / Use</th>
                    <th>Symbol</th>
                    <th>Name / Use</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="glyph copyable" onclick="copyChar('\u{1F79B}', this)">🞛</td>
                    <td>Crystal (main)</td>
                    <td class="glyph copyable" onclick="copyChar('\u25C8', this)">◈</td>
                    <td>Crystal (comp.)</td>
                    <td class="glyph">🞜/🟆/▣</td>
                    <td>Crystal (alts)</td>
                </tr>
                <tr>
                    <td class="glyph copyable" onclick="copyChar('\u25BC', this)">▼</td>
                    <td>Shard</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
        <p class="centered-link"><a href="../index.html">Return to Home</a></p>
    </div>

    <script>
        function copyChar(char, el) {
            navigator.clipboard.writeText(char).then(() => {
                el.classList.remove('copied');
                void el.offsetWidth;
                el.classList.add('copied');

                setTimeout(() => {
                    el.classList.remove('copied');
                }, 700);
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }
    </script>
</body>
